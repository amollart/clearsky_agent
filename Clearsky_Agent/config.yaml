name: "ClearSky Agent"
version: "0.0.2"
slug: "clearsky_agent"
description: "Generates periodic Home Assistant snapshots and manages device warranties."
startup: services
boot: auto
homeassistant_api: true
ingress: true
panel_icon: mdi:shield-check
hassio_role: admin
host_network: false
arch:
  - amd64
  - aarch64
map:
  - config:rw
options:
  poll_interval: 90
schema:
  poll_interval: int