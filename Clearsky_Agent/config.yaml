name: "ClearSky Snapshot Agent"
version: "0.2.1"
slug: "clearsky_agent"
description: "Generates periodic Home Assistant snapshots for ClearSky and synchronizes with Azure Storage"
startup: services
boot: auto
homeassistant_api: true
ingress: true
panel_icon: mdi:shield-check
hassio_role: admin
host_network: false
arch:
  - amd64
  - aarch64
map:
  - homeassistant_config:rw
image: "ghcr.io/amollart/clearsky-agent/{arch}"
options:
  poll_interval: 90
  azure_upload_enabled: true
  azure_storage_connection_string: ""
  azure_container_name: "clearsky-snapshots"
schema:
  poll_interval: int
  azure_upload_enabled: bool?
  azure_storage_connection_string: password?
  azure_container_name: str?